<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="tab tab--active">For You</div>
</header>

<main id="feed" class="feed"></main>

<template id="post-template">
  <section class="post">
    <video class="post__video" playsinline muted loop preload="metadata"></video>
    <div class="post__tapzone" data-tapzone></div>
    <div class="post__heart-burst" data-heartburst>&#10084;</div>

    <div class="post__gradient"></div>

    <div class="post__info">
      <div class="post__username" data-username></div>
      <div class="post__caption" data-caption></div>
      <div class="post__sound">
        <svg viewBox="0 0 24 24" class="icon-note"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        <span class="post__sound-text" data-sound></span>
      </div>
    </div>

    <aside class="post__rail">
      <button class="rail__avatar-btn" data-follow>
        <span class="rail__avatar" data-avatar></span>
        <span class="rail__plus" data-plus>+</span>
      </button>

      <button class="rail__action" data-action="like">
        <svg viewBox="0 0 24 24" class="icon icon--heart" data-heart-icon>
          <path d="M12 21s-7.5-4.6-10-9.3C0.3 8.1 2 4.5 5.6 4c2-0.3 3.9 0.7 4.9 2.4C11.5 4.7 13.4 3.7 15.4 4c3.6 0.5 5.3 4.1 3.6 7.7C19.5 16.4 12 21 12 21z"/>
        </svg>
        <span class="rail__count" data-like-count></span>
      </button>

      <button class="rail__action" data-action="comment">
        <svg viewBox="0 0 24 24" class="icon icon--comment">
          <path d="M4 4h16v12H8l-4 4V4z"/>
        </svg>
        <span class="rail__count" data-comment-count></span>
      </button>

      <button class="rail__action" data-action="favourite">
        <svg viewBox="0 0 24 24" class="icon icon--bookmark" data-bookmark-icon>
          <path d="M6 3h12v18l-6-4-6 4V3z"/>
        </svg>
        <span class="rail__count" data-favourite-count></span>
      </button>

      <button class="rail__action" data-action="share">
        <svg viewBox="0 0 24 24" class="icon icon--share">
          <path d="M12 3v12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M7 8l5-5 5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="rail__count" data-share-count></span>
      </button>

      <div class="rail__disc" data-disc></div>
    </aside>

    <div class="post__progress"><div class="post__progress-fill" data-progress></div></div>
  </section>
</template>

<div class="sheet-backdrop" id="sheetBackdrop"></div>

<div class="sheet" id="commentSheet">
  <div class="sheet__handle"></div>
  <div class="sheet__header">
    <span id="commentSheetCount">0 comments</span>
    <button class="sheet__close" id="commentSheetClose">&times;</button>
  </div>
  <div class="sheet__list" id="commentList"></div>
  <form class="sheet__composer" id="commentForm">
    <span class="composer__avatar">Me</span>
    <input id="commentInput" class="composer__input" placeholder="Add comment..." autocomplete="off" maxlength="150">
    <button type="submit" class="composer__send">Post</button>
  </form>
</div>

<div class="sheet sheet--share" id="shareSheet">
  <div class="sheet__handle"></div>
  <div class="sheet__header"><span>Share to</span><button class="sheet__close" id="shareSheetClose">&times;</button></div>
  <div class="share__row">
    <button class="share__option" id="repostOption">
      <span class="share__icon share__icon--repost">&#8635;</span>
      <span data-repost-label>Repost</span>
    </button>
    <button class="share__option" id="copyLinkOption">
      <span class="share__icon">&#128279;</span>
      <span>Copy link</span>
    </button>
    <button class="share__option" id="duetOption">
      <span class="share__icon">&#9835;</span>
      <span>Duet</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
