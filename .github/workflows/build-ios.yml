name: Build iOS

on:
  push:
    branches: [master]
    paths:
      - "filmo/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    defaults:
      run:
        working-directory: filmo
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i Xcode || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project Filmo.xcodeproj \
            -scheme Filmo \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Filmo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/Filmo.xcarchive/Products/Applications/Filmo.app build/Payload/
          cd build
          zip -r Filmo.ipa Payload
          cd ..

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filmo-ipa
          path: filmo/build/Filmo.ipa
          if-no-files-found: error
